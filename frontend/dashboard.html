<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Expense Tracker</h2>
        <button id="logout">Logout</button>
    </nav>
    <div class="filters">
    <input type="text" id="filter-search" placeholder="Search title">
    <input type="text" id="filter-category" placeholder="Category">
    <input type="number" id="filter-min" placeholder="Min amount">
    <input type="number" id="filter-max" placeholder="Max amount">
    <input type="date" id="filter-from">
    <input type="date" id="filter-to">
    <select id="filter-sort">
        <option value="date">Date</option>
        <option value="amount">Amount</option>
    </select>
    <select id="filter-order">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
    </select>
    <button id="apply-filters">Apply</button>
    <button id="clear-filters">Clear</button>
</div>
    <div id="expenses"></div>
    
    <div id="modal" class="modal hidden">
    <form id="add-expense">
        <input type="text"  id="title" placeholder="Title">
        <textarea  id="description" placeholder="description"></textarea>
        <input type="number"  id="amount" placeholder="Amount">
        <input type="text" id="category" placeholder="Category">
        <input type="date" id="date">
        <button id="add-btn">Add+</button>
        <button id="cancel-btn">Cancel</button>
    </form>
    </div>
    <button onclick="getAllExpense()">Get Expenses</button>
    <button id="addexp">Add Expense</button>
    <div class="summary-card">
        <p>Total spent</p>
        <h2 id="total">0</h2>
    </div>.
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
