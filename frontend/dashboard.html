<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <h2>Expense Tracker</h2>
      <div class="nav-actions">
        <select id="theme-switcher" aria-label="Theme">
          <option value="daylight">Daylight</option>
          <option value="midnight">Midnight Neon</option>
          <option value="paper">Paper</option>
          <option value="terminal">Terminal</option>
          <option value="ocean">Ocean</option>
          <option value="aurora">Aurora</option>
          <option value="coffee">Coffee</option>
          <option value="forest">Forest</option>
          <option value="mono">Mono White</option>
          <option value="monodark">Mono Dark</option>
          <option value="citrus">Citrus</option>
        </select>
        <button id="logout">Logout</button>
      </div>
    </nav>

    <div class="summary-card">
      <p>Total spent</p>
      <h2 id="total">0</h2>
    </div>

    <div class="filters">
      <input type="text" id="filter-search" placeholder="Search title" />
      <input type="text" id="filter-category" placeholder="Category" />
      <input type="number" id="filter-min" placeholder="Min amount" />
      <input type="number" id="filter-max" placeholder="Max amount" />
      <input type="date" id="filter-from" />
      <input type="date" id="filter-to" />
      <select id="filter-sort">
        <option value="date">Date</option>
        <option value="amount">Amount</option>
      </select>
      <select id="filter-order">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>
      <button id="apply-filters">Apply</button>
      <button id="clear-filters">Clear</button>
    </div>

    <button id="addexp">Add Expense</button>
    <p id="error"></p>

    <div id="expenses"></div>

    <!--~ Add Expense Modal -->
    <div id="modal" class="modal hidden">
      <form id="add-expense">
        <input type="text" id="title" placeholder="Title" />
        <textarea id="description" placeholder="Description"></textarea>
        <input type="number" id="amount" placeholder="Amount" />
        <input type="text" id="category" placeholder="Category" />
        <input type="date" id="date" />
        <button id="add-btn">Add+</button>
        <button type="button" id="cancel-btn">Cancel</button>
      </form>
    </div>

    <!-- ~ Delete Confirmation Modal -->
    <div id="delete-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Are you sure?</h3>
        <p>
          Do you really want to delete this expense? This action cannot be
          undone.
        </p>
        <div class="modal-buttons">
          <button id="confirm-delete" class="BTN danger">Yes, Delete</button>
          <button id="cancel-delete" class="BTN">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    
  </body>
</html>
